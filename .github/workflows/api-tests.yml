name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: propflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout PropFlow-Automation
        uses: actions/checkout@v4

      - name: Checkout PropFlow
        uses: actions/checkout@v4
        with:
          repository: nasm24/PropFlow
          path: backend
          ref: 989dc2610e22bf122385de7c75f6cf108e25e8ee

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/frontend/package-lock.json

      - name: Install automation npm dependencies
        run: npm ci

      - name: Install frontend npm dependencies
        working-directory: backend/frontend
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start PropFlow
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          POSTGRES_PASSWORD: postgres
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run &

      - name: Wait until the API is ready
        timeout-minutes: 10
        run: |
          until curl -sf http://localhost:8081/api/properties >/dev/null; do
            echo "Waiting for http://localhost:8081/api/properties ..."
            sleep 3
          done

      - name: Start Vite frontend
        working-directory: backend/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8081
        run: npm run dev -- --host 0.0.0.0 --port 5173 &

      - name: Wait until the frontend is ready
        timeout-minutes: 5
        run: |
          until curl -sf http://localhost:5173/ >/dev/null; do
            echo "Waiting for http://localhost:5173/ ..."
            sleep 3
          done

      - name: Run Playwright API tests
        env:
          BASE_URL: http://localhost:8081
          CI: true
        run: npm run test:api

      - name: Run Playwright UI tests
        env:
          CI: true
        run: npm run test:ui

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
